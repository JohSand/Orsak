name: Build and Test

on: 
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'experiments/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'

  push:
    tags:
      - '*'
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'experiments/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Set version
        run: |
          dotnet gitversion /updateprojectfiles /output json > $HOME/version.json
          echo "GITVERSION=$(jq -c . < $HOME/version.json)" >> $GITHUB_ENV

      # The packages' release notes: a tag's section of CHANGELOG.md, so a tag without notes fails here, before
      # anything is published, and the Unreleased section for the prereleases from main.
      - name: Extract the release notes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          else
            scripts/changelog-section.sh Unreleased > "$RUNNER_TEMP/release-notes.md" \
              || echo "See https://github.com/JohSand/Orsak/blob/main/CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build -c Release --report-xunit-trx --results-directory ./test-results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
            files: test-results/**/*.trx

      - name: Pack NuGet package
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: dotnet pack --configuration Release --output ./nupkg -p:OrsakReleaseNotesFile="$RUNNER_TEMP/release-notes.md"

      # Downloads every source file the packed assemblies' PDBs refer to, from GitHub at this commit, and checks
      # it against the PDB's checksum, so that a package whose Source Link doesn't resolve isn't published.
      - name: Test Source Link
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          for package in ./nupkg/*.nupkg; do
            dir="./sourcelink-test/$(basename "$package" .nupkg)"
            mkdir -p "$dir"
            unzip -q -o "$package" -d "$dir"
            for dll in "$dir"/lib/*/*.dll; do
              dotnet sourcelink test "$dll"
            done
          done

      - name: Upload the packages
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: nupkg/*.nupkg
          if-no-files-found: error

  build-and-test-dynamic-path:
    # Resumable-code state machines (eff {}, effSeq {}, ...) are normally reduced to a real
    # compiled state machine at compile time. src/Directory.Build.props defaults Optimize=true
    # (even for Debug) so that reduction stays reliable under newer F# compilers where it's no
    # longer guaranteed at Optimize=false - but that default can be overridden with
    # -p:Optimize=false, which is exactly what this job does, to keep Orsak's dynamic
    # (non-statically-reduced) fallback implementations under CI coverage on their own. Without
    # this job those code paths only ever get exercised by accident, which is how the SDK
    # 10.0.400 F# compiler regression went unnoticed for as long as it did.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Set version
        run: |
          dotnet gitversion /updateprojectfiles /output json > $HOME/version.json
          echo "GITVERSION=$(jq -c . < $HOME/version.json)" >> $GITHUB_ENV

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build the project (dynamic resumable-code path forced)
        run: dotnet build --configuration Debug -p:Optimize=false

      - name: Run unit tests (dynamic resumable-code path forced)
        run: dotnet test --no-build -c Debug -p:Optimize=false --report-xunit-trx --results-directory ./test-results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
            check_name: Dynamic Path Test Results
            files: test-results/**/*.trx

  # Publishes the packages once both test jobs pass. A push to main publishes prereleases to GitHub Packages; a tag,
  # made by scripts/release.sh, publishes the release to nuget.org and then creates its GitHub release, with the notes
  # of its section of CHANGELOG.md followed by GitHub's list of merged pull requests.
  publish:
    if: ${{ github.event_name == 'push' }}
    needs: [build-and-test, build-and-test-dynamic-path]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      packages: write # GitHub Packages
      id-token: write # nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: nupkg

      - name: Push the prereleases to GitHub Packages
        if: ${{ github.ref_type == 'branch' }}
        run: >
          dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

      - name: Check that the packages have the tag's version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          for package in Orsak Orsak.AspNetCore Orsak.AspNetCore.OpenApi Orsak.Myriad; do
            test -f "nupkg/$package.$GITHUB_REF_NAME.nupkg" || { echo "nupkg/$package.$GITHUB_REF_NAME.nupkg is missing"; ls nupkg; exit 1; }
          done

      # Trusted Publishing: exchanges the job's OIDC token for an API key valid for an hour, under the nuget.org policy
      # for this repository and workflow file, github-actions.yml, so no API key is stored as a secret. It runs for main
      # too, without pushing, so a policy that no longer matches fails the next push to main rather than the release.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: johannesosandgren

      - name: Push the release to nuget.org
        if: ${{ github.ref_type == 'tag' }}
        run: >
          dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
